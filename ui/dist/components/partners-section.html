<!-- Partners Section Component -->
<div x-show="$store.app.activeSection === 'partners'" class="space-y-8">
    <h2 class="text-2xl font-bold text-slate-900">Partner Management</h2>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left Column: Discovery -->
        <div class="space-y-6">
            <!-- QR Code Card -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-4">Your Onboarding QR</h3>
                <div class="flex flex-col items-center">
                    <img src="/api/dashboard/qr?size=256" alt="QR Code" class="w-64 h-64 border-4 border-slate-200 rounded-lg">
                    <p class="text-sm text-slate-600 mt-4 text-center">Partners scan this to auto-discover your node</p>
                    <button @click="$store.partners.downloadQR()" 
                            class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                        Download QR Code
                    </button>
                </div>
            </div>

            <!-- Discover Partner Card -->
            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-4">Discover Partner</h3>
                
                <!-- Manual URL Input -->
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-2">Discovery URL</label>
                    <input type="text" 
                           x-model="$store.partners.discoveryUrl"
                           placeholder="https://partner.com/.well-known/as5-configuration" 
                           class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm"
                           @keyup.enter="$store.partners.discoverPartner()">
                    <button @click="$store.partners.discoverPartner()" 
                            class="mt-3 w-full px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition text-sm font-medium">
                        Discover Partner
                    </button>
                </div>

                <div class="border-t border-slate-200 my-4"></div>

                <!-- QR Scanner -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Or Scan Partner's QR</label>
                    <div id="qr-reader" class="w-full rounded-lg overflow-hidden border border-slate-300"></div>
                    <button @click="$store.partners.toggleScanner()" 
                            :class="$store.partners.scannerActive ? 'bg-red-600 hover:bg-red-700' : 'bg-green-600 hover:bg-green-700'"
                            class="mt-3 w-full px-4 py-2 text-white rounded-lg transition text-sm font-medium"
                            x-text="$store.partners.scannerActive ? 'Stop Scanner' : 'Start Scanner'">
                    </button>
                </div>

                <!-- Discovery Status -->
                <div x-show="$store.partners.discoveryStatus.show" 
                     x-transition
                     :class="$store.partners.discoveryStatus.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'"
                     class="mt-4 p-4 rounded-lg">
                    <p class="text-sm" x-text="$store.partners.discoveryStatus.message"></p>
                </div>
            </div>
        </div>

        <!-- Right Column: Partners List -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
                <h3 class="text-lg font-bold text-slate-900 mb-4">Connected Partners</h3>
                <div class="space-y-3">
                    <template x-if="$store.partners.list.length === 0">
                        <p class="text-sm text-slate-500 text-center py-8">No partners yet. Scan a QR code to add one!</p>
                    </template>
                    <template x-for="partner in $store.partners.list" :key="partner.id">
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 transition">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                                    <span class="text-white font-bold text-sm" x-text="partner.name.substring(0, 2).toUpperCase()"></span>
                                </div>
                                <div>
                                    <p class="font-medium text-slate-900" x-text="partner.name"></p>
                                    <p class="text-xs text-slate-500" x-text="partner.partner_id"></p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="px-3 py-1 text-xs font-medium text-green-700 bg-green-100 rounded-full">Connected</span>
                                <button @click="$store.partners.deletePartner(partner.id)" 
                                        class="p-1 text-slate-400 hover:text-red-600 transition">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- WebSocket Status Indicator Component -->
<div :class="{
        'bg-green-100 text-green-800': $store.app.wsStatus === 'connected',
        'bg-red-100 text-red-800': $store.app.wsStatus === 'error',
        'bg-yellow-100 text-yellow-800': $store.app.wsStatus === 'disconnected'
     }"
     class="fixed bottom-4 right-4 px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all duration-300">
    <span :class="{
            'bg-green-500': $store.app.wsStatus === 'connected',
            'bg-red-500': $store.app.wsStatus === 'error',
            'bg-yellow-500': $store.app.wsStatus === 'disconnected'
          }"
          class="ws-dot inline-block w-2 h-2 rounded-full mr-2"></span>
    <span x-text="$store.app.wsStatusText"></span>
</div>

<!-- Dashboard Section Component -->
<div x-show="$store.app.activeSection === 'dashboard'" class="space-y-8">
    <h2 class="text-2xl font-bold text-slate-900">Dashboard Overview</h2>
    
    <!-- Metrics Cards -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6">
        <!-- Messages Delivered -->
        <div class="metric-card bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-600">Delivered (24h)</p>
                    <p x-text="$store.dashboard.metrics.delivered" class="text-3xl font-bold text-slate-900 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Messages Queued -->
        <div class="metric-card bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-600">Queued</p>
                    <p x-text="$store.dashboard.metrics.queued" class="text-3xl font-bold text-slate-900 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Messages Failed -->
        <div class="metric-card bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-600">Failed</p>
                    <p x-text="$store.dashboard.metrics.failed" class="text-3xl font-bold text-slate-900 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Success Rate -->
        <div class="metric-card bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-600">Success Rate</p>
                    <p x-text="$store.dashboard.metrics.successRate" class="text-3xl font-bold text-slate-900 mt-2">0%</p>
                </div>
                <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <!-- Active Partners -->
        <div class="metric-card bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-slate-600">Partners</p>
                    <p x-text="$store.dashboard.metrics.partners" class="text-3xl font-bold text-slate-900 mt-2">0</p>
                </div>
                <div class="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                    <svg class="w-6 h-6 text-amber-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Messages -->
    <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
        <h3 class="text-lg font-bold text-slate-900 mb-4">Recent Messages</h3>
        <div class="space-y-3">
            <template x-if="$store.dashboard.messages.length === 0">
                <p class="text-sm text-slate-500 text-center py-8">No messages yet</p>
            </template>
            <template x-for="msg in $store.dashboard.messages" :key="msg.message_id">
                <div class="flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 transition">
                    <div class="flex-1">
                        <div class="flex items-center space-x-2">
                            <span class="text-xs font-mono text-slate-500" x-text="msg.message_id.substring(0, 8) + '...'"></span>
                            <span class="px-2 py-0.5 text-xs font-medium rounded"
                                  :class="msg.direction === 'INBOUND' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'"
                                  x-text="msg.direction"></span>
                        </div>
                        <p class="text-xs text-slate-500 mt-1" x-text="new Date(msg.created_at).toLocaleString()"></p>
                    </div>
                    <span class="px-3 py-1 text-xs font-medium rounded"
                          :class="$store.dashboard.getStatusColor(msg.status)"
                          x-text="msg.status"></span>
                </div>
            </template>
        </div>
    </div>
</div>

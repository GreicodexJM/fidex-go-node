<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FideX Edge Node</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- AlpineJS -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Route Constants -->
    <script src="/js/constants.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md" x-data="loginForm()">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-xl mb-4">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-white">FideX Edge Node</h1>
            <p class="text-slate-400 mt-2">AS5 Gateway Dashboard</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-slate-900 mb-6">Sign In</h2>
            
            <!-- Error Message -->
            <div x-show="errorMessage" 
                 x-transition
                 class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-800" x-text="errorMessage"></p>
            </div>

            <!-- Login Form -->
            <form @submit.prevent="submitLogin">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        x-model="username"
                        required
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                        placeholder="Enter your username"
                        autocomplete="username"
                        :disabled="loading"
                    >
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        x-model="password"
                        required
                        class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        :disabled="loading"
                    >
                </div>

                <button 
                    type="submit" 
                    :disabled="loading"
                    :class="loading ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'"
                    class="w-full text-white py-3 rounded-lg font-semibold transition-colors focus:ring-4 focus:ring-blue-200"
                >
                    <span x-show="!loading">Sign In</span>
                    <span x-show="loading">Signing in...</span>
                </button>
            </form>

            <!-- Default Credentials Info -->
            <div class="mt-6 p-4 bg-amber-50 border border-amber-200 rounded-lg">
                <p class="text-sm text-amber-800 font-medium mb-1">Default Credentials</p>
                <p class="text-sm text-amber-700">Username: <code class="bg-amber-100 px-2 py-0.5 rounded">admin</code></p>
                <p class="text-sm text-amber-700">Password: <code class="bg-amber-100 px-2 py-0.5 rounded">admin123</code></p>
                <p class="text-xs text-amber-600 mt-2">⚠️ Change after first login!</p>
            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-slate-500 text-sm mt-8">
            &copy; 2026 FideX Edge Node. Powered by AS5 Protocol.
        </p>
    </div>

    <script>
        function loginForm() {
            return {
                username: '',
                password: '',
                errorMessage: '',
                loading: false,
                
                async submitLogin() {
                    this.errorMessage = '';
                    this.loading = true;

                    // Ensure routes are loaded
                    await window.ROUTES.init();

                    try {
                        const response = await fetch(window.ROUTES.auth.login, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            }),
                            credentials: 'include'
                        });

                        const data = await response.json();

                        if (response.ok && data.success) {
                            window.location.href = window.ROUTES.pages.dashboard;
                        } else {
                            this.errorMessage = data.message || 'Login failed. Please try again.';
                            this.loading = false;
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        this.errorMessage = 'Network error. Please check your connection.';
                        this.loading = false;
                    }
                },
                
                init() {
                    // Auto-focus username field
                    this.$nextTick(() => {
                        document.getElementById('username').focus();
                    });
                }
            }
        }
    </script>
</body>
</html>

version: '3.8'

services:
  fidex-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: fidex-node:latest
    container_name: fidex-edge-node
    ports:
      - "8080:8080"  # Internal API (ERP-facing)
      - "8443:8443"  # Public API (B2B-facing)
    volumes:
      - ./fidex:/app/fidex           # Mount fidex directory for file watcher
      - fidex-data:/app/data         # Persistent storage for database
    environment:
      - TZ=UTC
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8443/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - fidex-network

volumes:
  fidex-data:
    driver: local

networks:
  fidex-network:
    driver: bridge
